name: Frontend hooks lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hooks-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned eslint toolchain (not saved to lockfile)
        working-directory: frontend
        run: npm install --no-save --no-audit --no-fund eslint@9.39.5 typescript-eslint@8.72.1 eslint-plugin-react-hooks@7.1.1
      - name: ESLint react-hooks gate
        working-directory: frontend
        run: npx eslint .
