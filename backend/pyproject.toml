[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "holdemfoldem-backend"
version = "1.0.0"
description = "Hold Em or Fold Em — verdict engine, FastAPI backend, CLI, and MCP server"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "cachetools>=5.0.0",
    "typer>=0.24.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
    "mcp>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
holdfold = "cli.app:app"
holdemfoldem-mcp = "mcp_server.server:main"

[tool.setuptools]
py-modules = ["core", "main"]

[tool.setuptools.packages.find]
include = ["cli*", "mcp_server*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
